services:
  neo4j:
    image: neo4j:5.15
    restart: always
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_apoc_export_file_enabled=false
      - NEO4J_apoc_import_file_enabled=false
      - NEO4J_apoc_import_file_use__neo4j__config=true
      - NEO4J_dbms_security_procedures_unrestricted=apoc.meta.*,apoc.schema.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.meta.*,apoc.schema.*,apoc.math.*,apoc.text.*,apoc.util.*,apoc.convert.*,apoc.map.*,apoc.coll.*,apoc.date.*,apoc.node.*,apoc.rel.*,apoc.path.*,apoc.algo.*,apoc.create.*,apoc.periodic.*,apoc.refactor.*,apoc.merge.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    networks:
      - papermanager

  backend:
    build: ./backend
    restart: always
    dns:
      - 185.12.64.1
      - 185.12.64.2
      - 8.8.8.8
    # Backstop so a runaway ingest can't take the host down. Steady state is well
    # under 1 GB; peak during figure extraction is a few hundred MB on top.
    mem_limit: 8g
    environment:
      # Figure extraction allocates and frees hundreds of MB per PDF. Without these,
      # glibc keeps every freed arena mapped and RSS never comes back down.
      - MALLOC_TRIM_THRESHOLD_=131072
      - MALLOC_ARENA_MAX=2
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_WORK_API_KEY=${ANTHROPIC_WORK_API_KEY:-}
      - ANTHROPIC_WORK_BASE_URL=${ANTHROPIC_WORK_BASE_URL:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_DRIVE_FOLDER_ID=${GOOGLE_DRIVE_FOLDER_ID:-}
      - GOOGLE_CREDENTIALS_FILE=${GOOGLE_CREDENTIALS_FILE:-}
      - GOOGLE_TOKEN_FILE=${GOOGLE_TOKEN_FILE:-}
      - BACKEND_PORT=8000
      - FRONTEND_URL=https://papermanager.niklas-abraham.de
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - DEFAULT_USER_NAME=${DEFAULT_USER_NAME:-niklas}
      - DEFAULT_USER_PASSWORD=${DEFAULT_USER_PASSWORD}
      - TRUSTED_HOSTS=papermanager.niklas-abraham.de,localhost,127.0.0.1
      - TRUST_PROXY_HEADERS=true
      - SSL_VERIFY=${SSL_VERIFY:-true}
      - SSL_CA_BUNDLE=${SSL_CA_BUNDLE:-}
      - LITELLM_ENDPOINT=${LITELLM_ENDPOINT:-}
      - LITELLM_API_KEY=${LITELLM_API_KEY:-}
      - LITELLM_MODEL=${LITELLM_MODEL:-google/gemma-4-26b-a4b-it}
      # Empty = embeddings disabled (proxy has no working embedding model).
      - LITELLM_EMBED_MODEL=${LITELLM_EMBED_MODEL:-}
      - DOCLING_MODE=${DOCLING_MODE:-on_demand}
      - INFERENCE_MANAGER_URL=${INFERENCE_MANAGER_URL:-https://inference-manager.example.internal}
      - HERMIONE_HOST=${HERMIONE_HOST:-203.0.113.10}
      - DOCLING_HOST_PORT=${DOCLING_HOST_PORT:-8004}
      - DOCLING_READY_TIMEOUT=${DOCLING_READY_TIMEOUT:-600}
      - DOCLING_SERVE_URL=${DOCLING_SERVE_URL:-}
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}
      - RATE_LIMIT_DEFAULT_REQUESTS=${RATE_LIMIT_DEFAULT_REQUESTS:-180}
      - RATE_LIMIT_DEFAULT_WINDOW_SECONDS=${RATE_LIMIT_DEFAULT_WINDOW_SECONDS:-60}
      - RATE_LIMIT_AUTH_REQUESTS=${RATE_LIMIT_AUTH_REQUESTS:-10}
      - RATE_LIMIT_AUTH_WINDOW_SECONDS=${RATE_LIMIT_AUTH_WINDOW_SECONDS:-60}
      - RATE_LIMIT_EXEMPT_PATHS=${RATE_LIMIT_EXEMPT_PATHS:-/docs,/redoc,/openapi.json}
      - RATE_LIMIT_AUTH_PATHS=${RATE_LIMIT_AUTH_PATHS:-/auth/login,/auth/register,/auth/admin/create-user}
    depends_on:
      - neo4j
    networks:
      - papermanager
    volumes:
      - ./backend:/app
      - ./prompts:/prompts
      - backend_data:/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - backend
    networks:
      - papermanager
      - proxy
    labels:
      - "traefik.enable=true"
      # HTTPS router
      - "traefik.http.routers.papermanager.rule=Host(`papermanager.niklas-abraham.de`)"
      - "traefik.http.routers.papermanager.entrypoints=websecure"
      - "traefik.http.routers.papermanager.tls=true"
      - "traefik.http.routers.papermanager.tls.certresolver=letsencrypt"
      # Service config
      - "traefik.http.services.papermanager.loadbalancer.server.port=80"
      - "traefik.docker.network=proxy"

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:
  backend_data:

networks:
  papermanager:
    driver: bridge
  proxy:
    external: true

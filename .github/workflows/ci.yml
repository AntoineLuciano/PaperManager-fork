name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Runs the real DB queries against a live Neo4j 5 so Cypher syntax errors and
  # version incompatibilities fail the build. A mocked driver cannot catch these
  # — the bug that motivated this job (a PATCH /papers query missing the `WITH`
  # required between SET and MATCH in Neo4j 5) returned HTTP 500 in production
  # but passed every unit test.
  backend-cypher:
    name: Backend · Cypher regression (Neo4j 5)
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.15
        env:
          NEO4J_AUTH: neo4j/testpassword
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "cypher-shell -u neo4j -p testpassword 'RETURN 1'"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 12
          --health-start-period 30s
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: testpassword
      JWT_SECRET_KEY: test-secret
      DEFAULT_USER_PASSWORD: test-password
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-test.txt

      - name: Install test dependencies
        run: pip install -r backend/requirements-test.txt

      # Fail loudly (rather than letting the tests skip) if Neo4j never came up,
      # so the job can never go green without actually exercising the database.
      - name: Wait for Neo4j to accept connections
        run: |
          python - <<'PY'
          import time, sys
          from neo4j import GraphDatabase
          for attempt in range(30):
              try:
                  d = GraphDatabase.driver("bolt://localhost:7687", auth=("neo4j", "testpassword"))
                  d.verify_connectivity()
                  print("Neo4j is up")
                  sys.exit(0)
              except Exception as exc:
                  print(f"waiting for Neo4j ({attempt})... {exc}")
                  time.sleep(3)
          print("Neo4j did not become available", file=sys.stderr)
          sys.exit(1)
          PY

      - name: Run Cypher regression tests
        working-directory: backend
        run: python -m pytest tests/test_cypher_regression.py -m integration -v

  backend-e2e-mock:
    name: Backend · E2E mock tests (no services)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: unused
      JWT_SECRET_KEY: test-secret
      DEFAULT_USER_PASSWORD: test-password
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run E2E mock tests
        working-directory: backend
        run: python -m pytest tests/test_e2e_mock.py -v

  frontend:
    name: Frontend · vitest + typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test

      # Matches the production Docker build (frontend/Dockerfile runs `npm run
      # build`). A full type-check (`build:check`) is intentionally not run here
      # because the codebase currently has pre-existing tsc errors; tightening
      # that is a separate cleanup.
      - name: Build
        run: npm run build

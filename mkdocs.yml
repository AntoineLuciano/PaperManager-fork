site_name: PaperManager
site_description: A self-hosted second brain for research papers, with AI summaries, interactive concepts and a Neo4j knowledge graph
site_author: Niklas Abraham
site_url: https://niklasabraham.github.io/PaperManager/
repo_url: https://github.com/NiklasAbraham/PaperManager
repo_name: NiklasAbraham/PaperManager
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    logo: material/book-open-page-variant
    repo: fontawesome/brands/github
  favicon: img/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy
    - content.code.annotate
    - toc.follow

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - def_list
  - tables
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

# Old planning notes kept in the repo but not published.
exclude_docs: |
  tasks/
  overview.md
  data_model.md
  project_structure.md

nav:
  - Home: index.md
  - Get started:
    - First steps: user-guide/first-steps.md
    - Hosting your own: self_hosting.md
    - Local development: user-guide/getting-started.md
  - Using PaperManager:
    - Adding papers: user-guide/ingestion.md
    - Library: user-guide/library.md
    - Reading a paper: user-guide/paper-detail.md
    - Concepts, tour and concept map: user-guide/reading-tools.md
    - Knowledge chat and graph: user-guide/knowledge-features.md
    - MCP server (Claude): user-guide/mcp-server.md
  - Technical reference:
    - Architecture: technical/architecture.md
    - Backend: technical/backend.md
    - Frontend: technical/frontend.md
    - Data model: technical/data-model.md
    - AI pipelines: technical/ai-pipelines.md
    - Ingestion workflow: technical/ingestion-workflow.md
    - API reference: technical/api-reference.md
    - UI style guide: style-guide.md
    - Decisions log: decisions.md

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/NiklasAbraham/PaperManager
    - icon: fontawesome/solid/globe
      link: https://niklas-abraham.de/projects/papermanager/
